<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background with soft rounded corners -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg-gradient)" />
  
  <!-- Inner crisp white container for contrast -->
  <rect x="64" y="64" width="384" height="384" rx="85" ry="85" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Medical Teal Heartbeat Pulse Line -->
  <path 
    d="M 100 256 L 180 256 L 210 160 L 260 380 L 300 190 L 330 256 L 412 256" 
    fill="none" 
    stroke="#0d9488" 
    stroke-width="32" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  
  <!-- Teal dot at the end of the pulse -->
  <circle cx="412" cy="256" r="16" fill="#0d9488" />
</svg>
